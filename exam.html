<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIT303 Mathematics Exam</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="exam">

    <header class="examHeader">

        <button id="backBtn">← Home</button>

        <div class="titleArea">
            <h2 id="title">Loading...</h2>
            <p id="questionNumber">Question 1 / 50</p>
        </div>

    </header>

    <main>

        <div class="imagePanel">

            <img
                id="questionImage"
                src=""
                alt="Question Image"
            >

        </div>

        <div class="answerPanel">

            <h3>Select Answer</h3>

            <label>
                <input type="radio" name="answer" value="A">
                A
            </label>

            <label>
                <input type="radio" name="answer" value="B">
                B
            </label>

            <label>
                <input type="radio" name="answer" value="C">
                C
            </label>

            <label>
                <input type="radio" name="answer" value="D">
                D
            </label>

            <label>
                <input type="radio" name="answer" value="E">
                E
            </label>

        </div>

    </main>

    <footer class="navigation">

        <button id="prevBtn">
            ◀ Previous
        </button>

        <button id="nextBtn">
            Next ▶
        </button>

    </footer>

</div>

<script src="exam.js"></script>

</body>
</html>
