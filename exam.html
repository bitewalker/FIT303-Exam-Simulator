<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FIT303 Exam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="exam-shell">
    <header class="exam-header card">
      <button id="homeBtn">Home</button>
      <div><h1 id="title">Loading…</h1><p id="questionNumber"></p></div>
      <div class="timer"><span>Time</span><strong id="timer">00:00:00</strong></div>
    </header>

    <section class="card image-card">
      <img id="questionImage" alt="Question screenshot">
    </section>

    <section class="card answer-card">
      <h2>Select your answer</h2>
      <fieldset id="answers">
        <label><input type="radio" name="answer" value="A"> A</label>
        <label><input type="radio" name="answer" value="B"> B</label>
        <label><input type="radio" name="answer" value="C"> C</label>
        <label><input type="radio" name="answer" value="D"> D</label>
        <label><input type="radio" name="answer" value="E"> E</label>
      </fieldset>
      <button id="clearAnswerBtn">Clear selection</button>
    </section>

    <footer class="card exam-actions">
      <button id="prevBtn">Previous</button>
      <button id="finishBtn" class="primary">Finish exam</button>
      <button id="nextBtn">Next</button>
    </footer>
  </main>
  <script src="exam.js"></script>
</body>
</html>
